<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Запись на приём - GetWell Widget</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f5f5f5;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        display: flex;
        justify-content: center;
      }

      #widget-root {
        width: 600px;
        height: 100vh;
      }
    </style>
  </head>
  <body data-widget-blank>
    <!-- GetWell Widget - подключение одним блоком -->
    <script>
      // Конфигурация виджета
      window.GetWellWidgetConfig = {
        apiUrl: '',
        theme:'dark' ,
        showBranches: true,
        showEmployees: true,
        showDepartments: true,
        stickyBtnEnable: true,
        isNeedToBlankOpen: false,
        renderedAsPage: false,
        showDepartments: true,
        showDoctorInfo: true,
        showEmployeePosition: true,
        isExternalLinkPolicy: true,
        stickyButtonPulse: true,
        stickyButtonPosition: 'left',
        stickyButtonColor: '#782c2c',
        
        textPolicy: 'textPolicy',
        // linkToExternalPolicy: 'https://getwell-widget.flareon.ru/privacy-policy',
        branches: [
        
        ],
        // linkToExternalPolicy: 'https://getwell-widget.flareon.ru/privacy-policy',

        basePath: './dist',
      };
    </script>
    <script>
      (function (config) {
        config = config || window.GetWellWidgetConfig || {};
        const basePath = config.basePath || './dist';

        // Добавляем CSS
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = basePath + '/index.umd.css';
        document.head.appendChild(link);

        // Загружаем JS
        const script = document.createElement('script');
        script.src = basePath + '/index.umd.js';
        script.onload = function () {
          // Создаём корневой элемент для виджета
          const widgetRoot = document.createElement('div');
          widgetRoot.id = 'widget-root';
          document.body.appendChild(widgetRoot);

          if (window.GetWellWidget && config.apiUrl) {
            const { basePath, ...initConfig } = config;
            // Асинхронная инициализация с загрузкой конфига
            window.GetWellWidget.init(initConfig)
              .then(() => {
                if (window.GetWellWidget.WidgetProvider && window.React && window.ReactDOM) {
                  const root = window.ReactDOM.createRoot(widgetRoot);
                  root.render(window.React.createElement(window.GetWellWidget.WidgetProvider));
                }
              })
              .catch((error) => {
                console.error('Failed to initialize widget:', error);
                // В случае ошибки все равно рендерим виджет с начальным конфигом
                if (window.GetWellWidget.WidgetProvider && window.React && window.ReactDOM) {
                  const root = window.ReactDOM.createRoot(widgetRoot);
                  root.render(window.React.createElement(window.GetWellWidget.WidgetProvider));
                }
              });
          }
        };
        document.body.appendChild(script);
      })(window.GetWellWidgetConfig);
    </script>
  </body>
</html>
