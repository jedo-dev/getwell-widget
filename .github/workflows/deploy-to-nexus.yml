name: Deploy to Nexus

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'http://192.168.50.167:8081/repository/getwell-widget/'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish to Nexus
        env:
          NEXUS_AUTH: ${{ secrets.NEXUS_AUTH }}
        run: npm publish
        if: github.event_name != 'pull_request'
