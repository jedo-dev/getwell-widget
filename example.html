<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GetWell Widget Example</title>

    <!-- CSS библиотеки виджета (включает все необходимые стили) -->
    <link rel="stylesheet" href="./dist/index.umd.css" />

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        padding: 40px;
        background: #f5f5f5;
        margin: 0;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #1890ff;
        margin-bottom: 30px;
      }
      .button-group {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 30px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background: #1890ff;
        color: white;
        transition: background 0.3s;
      }
      button:hover {
        background: #40a9ff;
      }
      button.secondary {
        background: #52c41a;
      }
      button.secondary:hover {
        background: #73d13d;
      }
      button.danger {
        background: #ff4d4f;
      }
      button.danger:hover {
        background: #ff7875;
      }
      .info {
        background: #e6f7ff;
        border: 1px solid #91d5ff;
        border-radius: 4px;
        padding: 15px;
        margin-bottom: 20px;
      }
      #widget-root {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Пример использования GetWell Widget</h1>

      <div class="info">
        <strong>Инструкция:</strong>
        <ol>
          <li>Нажмите "Инициализировать виджет" для инициализации</li>
          <li>Нажмите "Открыть виджет" для открытия виджета записи</li>
          <li>Виджет откроется справа в виде Drawer</li>
        </ol>
      </div>

      <div class="button-group">
        <button onclick="initWidget()">Инициализировать виджет</button>
        <button onclick="openWidget()" class="secondary">Открыть виджет</button>
        <button onclick="closeWidget()" class="danger">Закрыть виджет</button>
        <button onclick="resetWidget()">Сбросить виджет</button>
      </div>

      <div id="widget-root"></div>
    </div>

    <!-- Библиотека GetWell Widget (UMD версия - все зависимости включены!) -->
    <script src="./dist/index.umd.js"></script>

    <script>
      // Инициализация виджета
      function initWidget() {
        console.log('window.GetWellWidget', window.GetWellWidget);
        if (window.GetWellWidget) {
          window.GetWellWidget.init({
            apiUrl: 'https://api.example.com',
            theme: {
              primaryColor: '#1890ff',
              secondaryColor: '#52c41a',
            },
            showBranches: true,
            showEmployees: true,
            showDepartments: true,
            stickyBtnEnable: true, // Включаем плавающую кнопку
          });
          alert('Виджет инициализирован! Теперь вы можете открыть его.');
        } else {
          alert('Библиотека GetWellWidget не загружена. Проверьте путь к файлу dist/index.cjs.js');
        }
      }

      // Открытие виджета
      function openWidget() {
        if (window.GetWellWidget) {
          window.GetWellWidget.open();
        } else {
          alert('Сначала инициализируйте виджет!');
        }
      }

      // Закрытие виджета
      function closeWidget() {
        if (window.GetWellWidget) {
          window.GetWellWidget.close();
        }
      }

      // Сброс виджета
      function resetWidget() {
        if (window.GetWellWidget) {
          window.GetWellWidget.reset();
          alert('Виджет сброшен');
        }
      }

      // Рендеринг WidgetProvider после загрузки страницы
      window.addEventListener('DOMContentLoaded', function () {
        // Проверяем, что библиотека загружена
        if (typeof window.GetWellWidget !== 'undefined' && window.GetWellWidget.WidgetProvider) {
          // Получаем корневой элемент для рендеринга
          const rootElement = document.getElementById('widget-root');

          if (rootElement) {
            // React и ReactDOM теперь доступны через глобальные переменные из бандла
            // Проверяем наличие React и ReactDOM
            if (window.React && window.ReactDOM) {
              // Проверяем, есть ли createRoot (React 18+) или используем render (React < 18)
              const WidgetProvider = window.GetWellWidget.WidgetProvider;
              const element = window.React.createElement(WidgetProvider);

              if (typeof window.ReactDOM.createRoot === 'function') {
                // React 18+
                const root = window.ReactDOM.createRoot(rootElement);
                root.render(element);
              } else if (typeof window.ReactDOM.render === 'function') {
                // React < 18
                window.ReactDOM.render(element, rootElement);
              } else {
                console.error('ReactDOM.render или ReactDOM.createRoot не найдены');
                return;
              }

              console.log('GetWell Widget Provider успешно инициализирован');
            } else {
              console.warn('React не найден. Возможно, библиотека не загружена полностью.');
              console.log('window.React:', window.React);
              console.log('window.ReactDOM:', window.ReactDOM);
            }
          }
        } else {
          console.warn('GetWell Widget не загружен правильно. Проверьте подключение скриптов.');
        }
      });
    </script>
  </body>
</html>
