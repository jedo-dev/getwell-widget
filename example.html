<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GetWell Widget – Offline Preview</title>

    <!-- 1) Подключи CSS UMD сборки (путь поправь под себя) -->
    <!-- Вариант А: если index.html лежит рядом с dist/ -->
    <link rel="stylesheet" href="./dist/index.umd.css" />
    <!-- Вариант B: если dist на другом хосте -->
    <!-- <link rel="stylesheet" href="https://your-cdn.example.com/getwell/dist/index.umd.css" /> -->

    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        padding: 16px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        padding: 10px 12px;
        cursor: pointer;
      }
      select,
      input {
        padding: 8px 10px;
      }
      pre {
        background: #f6f8fa;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 12px;
        margin-top: 12px;
      }
      .hint {
        color: #6b7280;
        font-size: 13px;
      }
      #widget-root {
        width: 100%;
      }
      #configView {
        min-width: 300px;
      }
      .flexible {
        display: flex;
      }
      textarea {
        min-height: 500px;
      }
      .widget-wrap {
        min-width: 600px;
      }
    </style>
  </head>

  <body>
    <div class="flexible">
      <div>
        <h2>GetWell Widget — offline/config-only запуск</h2>

        <div class="flexible">
          <div class="row">
            <button id="btnInit">Init (подхват window.GetWellWidgetConfig)</button>
            <button id="btnOpen">Open</button>
            <button id="btnReset">Reset</button>
          </div>

          <div class="card">
            <div class="row">
              <label for="stepSelect"><b>currentStep:</b></label>
              <select id="stepSelect">
                <option value="branch-selection">branch-selection</option>
                <option value="next-steps">next-steps</option>
                <option value="specialist-selection">specialist-selection</option>
                <option value="department-specialists-selection">
                  department-specialists-selection
                </option>
                <option value="doctor-info">doctor-info</option>
                <option value="date-time-selection">date-time-selection</option>
                <option value="phone-input">phone-input</option>
                <option value="appointment-details">appointment-details</option>
                <option value="appointment-confirmation">appointment-confirmation</option>
                <option value="privacy-policy">privacy-policy</option>
              </select>

              <button id="btnApplyStep">applyConfig(currentStep)</button>

              <label style="margin-left: 8px">
                <input type="checkbox" id="lockStep" />
                lockStep
              </label>

              <label style="margin-left: 8px">
                <input type="checkbox" id="preserveStepOnOpen" checked />
                preserveStepOnOpen
              </label>
            </div>

            <div class="row" style="margin-top: 10px">
              <label for="selectedBranchId"><b>selectedBranchId:</b></label>
              <input id="selectedBranchId" type="number" min="1" value="1" placeholder="1" />
              <label for="primaryColor"><b>primaryColor:</b></label>
              <input id="primaryColor" type="text" value="dark" placeholder="dark" />
              <button id="btnApplyTheme">applyConfig(theme)</button>
            </div>
          </div>
        </div>
        <div class="card">
          <div style="display: flex; gap: 10px">
            <textarea id="configView"></textarea>
          </div>
        </div>
      </div>

      <div class="card widget-wrap">
        <div id="widget-root"></div>
      </div>
    </div>

    <!-- 2) ВАЖНО: объявляем window.GetWellWidgetConfig ДО подключения JS -->
    <script>
      // Минимальный офлайн-конфиг: branches/employees/departments вручную.
      // Связи (какой врач в каком департаменте/филиале) пока не делаем — виджет может показать "плоские" списки.
      window.GetWellWidgetConfig = {
        offlineMode: true,

        // Превью-режим
        render: {
          currentStep: 'branch-selection',
          lockStep: false,
          preserveStepOnOpen: true,
          selectedBranchId: 1,
        },

        // UI
        theme: {
          primaryColor: 'dark',
        },

        // (опционально) Картинки/брендирование
        logo: 'https://i.pinimg.com/originals/21/11/e7/2111e76c17a6f2871c963409a9268bd0.jpg',
        logoUrl: 'https://i.pinimg.com/originals/21/11/e7/2111e76c17a6f2871c963409a9268bd0.jpg',
        desktopImageUrl:
          'https://i.pinimg.com/originals/21/11/e7/2111e76c17a6f2871c963409a9268bd0.jpg',
        mobileImageUrl:
          'https://i.pinimg.com/originals/21/11/e7/2111e76c17a6f2871c963409a9268bd0.jpg',

        // Флаги отображения
        showBranches: true,
        showEmployees: true,
        showDepartments: true,
        showDoctorInfo: true,
        showEmployeePosition: true,
        stickyButtonPulse: true,
        renderedAsPage: true,
        stickyButtonPosition: 'left',
        stickyButtonColor: '#782c2c',
        stickyBtnEnable: true,

        // Политика (для примера)
        textPolicy: {
          title: 'Политика конфиденциальности',
          // Можно HTML/текст — как у вас принято
          text: 'Пример текста политики. Здесь может быть ваш HTML или markdown-подобный текст.',
        },

        // Данные (пример)
        branches: [
          {
            id: 1,
            name: 'Клиника на Тверской',
            address: 'г. Москва, ул. Тверская, 1',
            phone: '+7 (999) 111-22-33',
          },
          {
            id: 2,
            name: 'Клиника на Арбате',
            address: 'г. Москва, ул. Арбат, 10',
            phone: '+7 (999) 444-55-66',
          },
        ],

        departments: [
          { id: 10, name: 'Терапия' },
          { id: 11, name: 'Хирургия' },
          { id: 12, name: 'Стоматология' },
        ],

        employees: [
          {
            id: 100,
            fullName: 'Иванов Илья Сергеевич',
            position: 'Ветеринарный врач',
            avatarUrl: 'https://dummyimage.com/120x120/111827/ffffff&text=I',
            description: 'Опыт 8 лет. Терапия, диагностика.',
          },
          {
            id: 101,
            fullName: 'Петрова Анна Дмитриевна',
            position: 'Хирург',
            avatarUrl: 'https://dummyimage.com/120x120/111827/ffffff&text=A',
            description: 'Опыт 6 лет. Мягкотканная хирургия.',
          },
          {
            id: 102,
            fullName: 'Сидоров Максим Олегович',
            position: 'Стоматолог',
            avatarUrl: 'https://dummyimage.com/120x120/111827/ffffff&text=M',
            description: 'Ультразвуковая чистка, удаление зубов.',
          },
        ],
      };
    </script>

    <!-- 3) Подключаем UMD JS (путь поправь под себя) -->
    <script src="./dist/index.umd.js"></script>
    <!-- Вариант B: -->
    <!-- <script src="https://your-cdn.example.com/getwell/dist/index.umd.js"></script> -->

    <script>
      const $ = (id) => document.getElementById(id);

      let widgetRoot = null;

      function renderConfig() {
        $('configView').value = JSON.stringify(window.GetWellWidgetConfig, null, 2);
      }

      function safeWidget() {
        if (!window.GetWellWidget) {
          alert('GetWellWidget не найден. Проверь подключение dist/index.umd.js');
          return null;
        }
        return window.GetWellWidget;
      }

      // Монтирование виджета в DOM
      function mountWidget() {
        if (!window.GetWellWidget || !window.GetWellWidget.WidgetProvider) {
          console.warn('WidgetProvider не доступен, попробуйте позже');
          return false;
        }

        if (!window.React || !window.ReactDOM || !window.ReactDOM.createRoot) {
          console.error('React или ReactDOM не доступны');
          return false;
        }

        const rootElement = document.getElementById('widget-root');
        if (!rootElement) {
          console.error('Контейнер widget-root не найден');
          return false;
        }

        // Если уже смонтирован, не монтируем повторно
        if (rootElement._reactRootContainer) {
          return true;
        }

        try {
          const root = window.ReactDOM.createRoot(rootElement);
          root.render(window.React.createElement(window.GetWellWidget.WidgetProvider));
          rootElement._reactRootContainer = root;
          return true;
        } catch (error) {
          console.error('Ошибка при монтировании виджета:', error);
          return false;
        }
      }

      // Первичный рендер конфига
      renderConfig();

      // Пытаемся смонтировать виджет после загрузки скрипта
      // Используем небольшую задержку, чтобы убедиться, что все загружено
      setTimeout(() => {
        if (mountWidget()) {
          console.log('Виджет успешно смонтирован');
        } else {
          console.warn('Не удалось смонтировать виджет при загрузке, попробуйте нажать Init');
        }
      }, 100);

      $('btnInit').addEventListener('click', async () => {
        const w = safeWidget();
        if (!w) return;

        // Убеждаемся, что виджет смонтирован
        if (!mountWidget()) {
          alert('Ошибка: не удалось смонтировать виджет. Проверьте консоль.');
          return;
        }

        // init без аргументов — должен подхватить window.GetWellWidgetConfig
        await w.init();
        alert('init() выполнен (config из window.GetWellWidgetConfig)');
      });

      $('btnOpen').addEventListener('click', () => {
        const w = safeWidget();
        if (!w) return;

        // Убеждаемся, что виджет смонтирован
        if (!mountWidget()) {
          alert('Ошибка: не удалось смонтировать виджет. Проверьте консоль.');
          return;
        }

        // Проверяем, что виджет инициализирован
        const state = w.getState();
        if (!state.initialized) {
          alert('Виджет не инициализирован. Сначала нажмите Init.');
          return;
        }

        w.open();
      });

      $('btnReset').addEventListener('click', () => {
        const w = safeWidget();
        if (!w) return;
        w.reset();
      });

      $('btnApplyStep').addEventListener('click', () => {
        const w = safeWidget();
        if (!w) return;

        const step = $('stepSelect').value;
        const lockStep = $('lockStep').checked;
        const preserveStepOnOpen = $('preserveStepOnOpen').checked;
        const selectedBranchRaw = $('selectedBranchId').value.trim();
        const selectedBranchId =
          selectedBranchRaw === '' ? null : Number.parseInt(selectedBranchRaw, 10);

        if (selectedBranchRaw !== '' && Number.isNaN(selectedBranchId)) {
          alert('selectedBranchId должен быть числом или пустым');
          return;
        }

        // Обновляем глобальный конфиг (как будто Flutter подменил на лету)
        window.GetWellWidgetConfig = {
          ...window.GetWellWidgetConfig,
          render: {
            ...(window.GetWellWidgetConfig.render || {}),
            currentStep: step,
            lockStep,
            preserveStepOnOpen,
            selectedBranchId,
          },
        };

        // Горячее применение в уже инициализированный виджет
        w.applyConfig(
          {
            render: { currentStep: step, lockStep, preserveStepOnOpen, selectedBranchId },
          },
          { resetState: false, rerender: true },
        );

        renderConfig();
      });

      $('btnApplyTheme').addEventListener('click', () => {
        const w = safeWidget();
        if (!w) return;

        const color = $('primaryColor').value.trim() || 'dark';

        window.GetWellWidgetConfig = {
          ...window.GetWellWidgetConfig,
          theme: { ...(window.GetWellWidgetConfig.theme || {}), primaryColor: color },
        };

        w.applyConfig({ theme: { primaryColor: color } }, { resetState: false, rerender: true });
        renderConfig();
      });

      // Авто-init (опционально): если хочешь, чтобы сразу запускалось при открытии страницы
      window.GetWellWidget.init();
      window.GetWellWidget.open();
    </script>
  </body>
</html>
