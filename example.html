<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GetWell Widget Example</title>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        padding: 40px;
        background: #f5f5f5;
        margin: 0;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #1890ff;
        margin-bottom: 30px;
      }
      .button-group {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 30px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background: #1890ff;
        color: white;
        transition: background 0.3s;
      }
      button:hover {
        background: #40a9ff;
      }
      button.secondary {
        background: #52c41a;
      }
      button.secondary:hover {
        background: #73d13d;
      }
      button.danger {
        background: #ff4d4f;
      }
      button.danger:hover {
        background: #ff7875;
      }
      .info {
        background: #e6f7ff;
        border: 1px solid #91d5ff;
        border-radius: 4px;
        padding: 15px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Пример использования GetWell Widget</h1>

      <div class="info">
        <strong>Инструкция:</strong>
        <p>
          Виджет инициализируется автоматически при загрузке страницы. Нажмите кнопку ниже для
          открытия виджета записи.
        </p>
      </div>

      <div class="button-group">
        <button onclick="window.GetWellWidget?.open()" class="secondary">Открыть виджет</button>
      </div>
    </div>

    <!-- GetWell Widget - подключение одним блоком (скопируйте в конец body) -->
    <script>
      // Конфигурация виджета (измените под свои нужды)
      window.GetWellWidgetConfig = {
        apiUrl: 'https://api.example.com',
        theme: { primaryColor: '#1890ff', secondaryColor: '#52c41a' },
        showBranches: true,
        showEmployees: true,
        showDepartments: true,
        stickyBtnEnable: true,
        basePath: './dist', // путь к файлам виджета
      };
    </script>
    <script>
      (function (config) {
        config = config || window.GetWellWidgetConfig || {};
        const basePath = config.basePath || './dist';

        // Добавляем CSS
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = basePath + '/index.umd.css';
        document.head.appendChild(link);

        // Загружаем JS
        const script = document.createElement('script');
        script.src = basePath + '/index.umd.js';
        script.onload = function () {
          const widgetRoot = document.createElement('div');
          widgetRoot.id = 'widget-root';
          document.body.appendChild(widgetRoot);

          if (window.GetWellWidget && config.apiUrl) {
            const { basePath, ...initConfig } = config;
            window.GetWellWidget.init(initConfig);

            if (window.GetWellWidget.WidgetProvider && window.React && window.ReactDOM) {
              const root = window.ReactDOM.createRoot(widgetRoot);
              root.render(window.React.createElement(window.GetWellWidget.WidgetProvider));
            }
          }
        };
        document.body.appendChild(script);
      })(window.GetWellWidgetConfig);
    </script>
  </body>
</html>
