<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GetWell Widget Example</title>

    <!-- Ant Design CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.28.1/dist/reset.css" />

    <!-- CSS библиотеки виджета -->
    <link rel="stylesheet" href="./dist/index.umd.css" />

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        padding: 40px;
        background: #f5f5f5;
        margin: 0;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #1890ff;
        margin-bottom: 30px;
      }
      .button-group {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 30px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background: #1890ff;
        color: white;
        transition: background 0.3s;
      }
      button:hover {
        background: #40a9ff;
      }
      button.secondary {
        background: #52c41a;
      }
      button.secondary:hover {
        background: #73d13d;
      }
      button.danger {
        background: #ff4d4f;
      }
      button.danger:hover {
        background: #ff7875;
      }
      .info {
        background: #e6f7ff;
        border: 1px solid #91d5ff;
        border-radius: 4px;
        padding: 15px;
        margin-bottom: 20px;
      }
      #widget-root {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Пример использования GetWell Widget</h1>

      <div class="info">
        <strong>Инструкция:</strong>
        <ol>
          <li>Нажмите "Инициализировать виджет" для инициализации</li>
          <li>Нажмите "Открыть виджет" для открытия виджета записи</li>
          <li>Виджет откроется справа в виде Drawer</li>
        </ol>
      </div>

      <div class="button-group">
        <button onclick="initWidget()">Инициализировать виджет</button>
        <button onclick="openWidget()" class="secondary">Открыть виджет</button>
        <button onclick="closeWidget()" class="danger">Закрыть виджет</button>
        <button onclick="resetWidget()">Сбросить виджет</button>
      </div>

      <div id="widget-root"></div>
    </div>

    <!-- React и ReactDOM через CDN (обязательно перед виджетом!) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <!-- Day.js через CDN (обязательно для Ant Design!) -->
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>

    <!-- Ant Design JS через CDN (обязательно перед виджетом!) -->
    <script src="https://unpkg.com/antd@5.28.1/dist/antd.min.js"></script>

    <!-- Библиотека GetWell Widget (UMD версия для браузера) -->
    <script src="./dist/index.umd.js"></script>

    <script>
      // Инициализация виджета
      function initWidget() {
        console.log('window.GetWellWidget', window.GetWellWidget);
        if (window.GetWellWidget) {
          window.GetWellWidget.init({
            apiUrl: 'https://api.example.com',
            theme: {
              primaryColor: '#1890ff',
              secondaryColor: '#52c41a',
            },
            showBranches: true,
            showEmployees: true,
            showDepartments: true,
          });
          alert('Виджет инициализирован! Теперь вы можете открыть его.');
        } else {
          alert('Библиотека GetWellWidget не загружена. Проверьте путь к файлу dist/index.cjs.js');
        }
      }

      // Открытие виджета
      function openWidget() {
        if (window.GetWellWidget) {
          window.GetWellWidget.open();
        } else {
          alert('Сначала инициализируйте виджет!');
        }
      }

      // Закрытие виджета
      function closeWidget() {
        if (window.GetWellWidget) {
          window.GetWellWidget.close();
        }
      }

      // Сброс виджета
      function resetWidget() {
        if (window.GetWellWidget) {
          window.GetWellWidget.reset();
          alert('Виджет сброшен');
        }
      }

      // Рендеринг WidgetProvider после загрузки страницы
      window.addEventListener('DOMContentLoaded', function () {
        // Проверяем, что библиотека загружена
        if (
          typeof window.GetWellWidget !== 'undefined' &&
          window.GetWellWidget.WidgetProvider &&
          window.React &&
          window.ReactDOM
        ) {
          // Получаем корневой элемент для рендеринга
          const rootElement = document.getElementById('widget-root');

          if (rootElement) {
            // Создаём React root
            const root = window.ReactDOM.createRoot(rootElement);

            // Рендерим WidgetProvider
            const WidgetProvider = window.GetWellWidget.WidgetProvider;
            root.render(window.React.createElement(WidgetProvider));

            console.log('GetWell Widget Provider успешно инициализирован');
          }
        } else {
          console.warn('GetWell Widget не загружен правильно. Проверьте подключение скриптов.');
        }
      });
    </script>
  </body>
</html>
